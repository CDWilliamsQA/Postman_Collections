name: QA Regression Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # --- API Tests (Postman/Newman) ---
      - name: Run Postman Collection
        run: |
          npm install -g newman
          newman run ./collections/Regression.postman_collection.json \
            --environment ./envs/qa.postman_environment.json \
            --reporters cli,junit --reporter-junit-export newman-results.xml

      # --- UI Tests (Selenium) ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install Selenium dependencies
        run: |
          pip install selenium pytest pytest-html

      - name: Run Selenium suite
        run: |
          pytest tests/ --html=reports/selenium_report.html --self-contained-html
